<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>X GYM — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   X GYM admin v2 — design system
   Same black / neon-red industrial look as the public site, rebuilt
   for daily use: big tap targets, readable type, sidebar on desktop,
   bottom tab bar on phones.
   ═══════════════════════════════════════════════════════════════ */
:root {
  --red: #e8001d; --red-hi: #ff2b45; --red-glow: rgba(232,0,29,.35); --red-soft: rgba(232,0,29,.12);
  --bg: #080808; --s1: #111111; --s2: #171717; --s3: #1f1f1f;
  --line: #262626; --line2: #343434;
  --tx: #f5f5f5; --tx2: #cfcfcf; --tx3: #8d8d8d;
  --green: #22c55e; --green-soft: rgba(34,197,94,.14);
  --amber: #ffb020; --amber-soft: rgba(255,176,32,.14);
  --danger: #ff5050; --danger-soft: rgba(255,80,80,.14);
  --blue: #38bdf8; --violet: #a78bfa; --wa: #25d366;
  --c-membership: #e8001d; --c-personal_training: #ffb020; --c-products: #38bdf8; --c-other: #a78bfa;
  --m-cash: #22c55e; --m-upi: #a78bfa; --m-card: #38bdf8; --m-bank: #ffb020; --m-other: #8d8d8d;
  --font-display: 'Bebas Neue','Impact','Arial Narrow',sans-serif;
  --font-head: 'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body: 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-w: 236px; --bar-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --radius: 10px;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--tx); font: 400 15px/1.45 var(--font-body); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
h1,h2,h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: .03em; line-height: 1; }
button { font: inherit; color: inherit; }
a { color: inherit; }
::selection { background: var(--red); color: #fff; }
:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2c2c2c; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--red); }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
[hidden] { display: none !important; }

/* ─── LOGIN ─── */
#loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: radial-gradient(ellipse 60% 50% at 50% 15%, rgba(232,0,29,.16) 0%, transparent 70%), var(--bg); }
.login-card { background: var(--s1); border: 1px solid var(--line); padding: 44px 34px 36px; width: 100%; max-width: 390px; text-align: center; border-radius: 14px;
  box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.logo { font-family: var(--font-display); font-size: 3.4rem; letter-spacing: .04em; line-height: 1; }
.logo span { color: var(--red); }
.login-sub { font-family: var(--font-head); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--tx3); margin: 6px 0 28px; }
.login-card .input { text-align: center; letter-spacing: .15em; margin-bottom: 14px; }
.login-error { color: var(--danger); font-size: 14px; margin-top: 14px; min-height: 20px; }

/* ─── SHELL ─── */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0,1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; background: var(--s1); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 14px 18px; }
.brand { padding: 0 10px 22px; }
.brand .logo { font-size: 2.3rem; }
.brand small { display: block; font-family: var(--font-head); font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--tx3); margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 8px; border: 0; background: none; width: 100%; text-align: left;
  color: var(--tx3); font-family: var(--font-head); font-weight: 600; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; position: relative; transition: background .15s, color .15s; text-decoration: none; }
.nav-item:hover { color: var(--tx); background: var(--s2); }
.nav-item.active { color: #fff; background: var(--red-soft); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--red); }
.nav-item .ic { font-size: 1.25em; }
.nav-item .lock { margin-left: auto; font-size: .95em; opacity: .7; }
.nav-sep { flex: 1; }
.nav-foot { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
.nav-foot .nav-item { font-size: 13px; padding: 10px 14px; }

.content { min-width: 0; }
.main { padding: 30px 34px 70px; max-width: 1220px; margin: 0 auto; animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.topbar-m { display: none; position: sticky; top: 0; z-index: 90; background: rgba(8,8,8,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  align-items: center; justify-content: space-between; padding: 10px 14px; }
.topbar-m .logo { font-size: 1.9rem; }
.topbar-m .tb-actions { display: flex; gap: 6px; }
.bottomnav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; background: rgba(14,14,14,.96); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); padding: 6px 6px calc(6px + var(--safe-b)); justify-content: space-around; }
.bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px; border: 0; background: none; border-radius: 8px;
  color: var(--tx3); font-family: var(--font-head); font-weight: 600; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.bn-item .ic { font-size: 1.5em; }
.bn-item.active { color: var(--red-hi); }
.bn-item.active .ic { filter: drop-shadow(0 0 6px var(--red-glow)); }

@media (max-width: 960px) {
  .shell { display: block; }
  .sidebar { display: none; }
  .topbar-m, .bottomnav { display: flex; }
  .main { padding: 18px 14px calc(var(--bar-h) + 34px + var(--safe-b)); }
}

/* ─── TYPE / PAGE HEAD ─── */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-size: 2.9rem; }
.page-head .sub { color: var(--tx3); font-size: 14px; margin-top: 6px; }
.page-head .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.label { font-family: var(--font-head); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tx3); }
.h-sec { font-family: var(--font-head); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--tx2); margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
.h-sec .grow { flex: 1; }
.h-sec a, .link { color: var(--red-hi); text-decoration: none; cursor: pointer; font-size: 13px; letter-spacing: .06em; background: none; border: 0; }
.h-sec a:hover, .link:hover { text-decoration: underline; }
.muted { color: var(--tx3); }
.ok-t { color: var(--green); } .warn-t { color: var(--amber); } .bad-t { color: var(--danger); }

/* ─── BUTTONS / INPUTS ─── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line2);
  background: var(--s2); color: var(--tx); font-family: var(--font-head); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  transition: transform .15s, background .15s, border-color .15s, box-shadow .15s, color .15s; text-decoration: none; white-space: nowrap; user-select: none; }
.btn:hover { border-color: var(--red); color: #fff; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-hi); border-color: var(--red-hi); box-shadow: 0 6px 22px var(--red-glow); }
.btn-wa { color: var(--wa); border-color: rgba(37,211,102,.35); background: rgba(37,211,102,.07); }
.btn-wa:hover { background: rgba(37,211,102,.16); border-color: var(--wa); color: var(--wa); }
.btn-danger { color: var(--danger); border-color: rgba(255,80,80,.35); background: transparent; }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.btn-danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: 12.5px; letter-spacing: .08em; }
.btn-icon { width: 40px; min-width: 40px; padding: 0; }
.btn-icon.btn-sm { width: 34px; min-width: 34px; }
.btn-block { width: 100%; }
.btn .ic { font-size: 1.2em; }
@media (max-width: 480px) { .btn { white-space: normal; text-align: center; line-height: 1.15; } .btn.btn-sm, .chip { white-space: nowrap; } }
.btn { max-width: 100%; }

.input, select.input, textarea.input { width: 100%; min-height: 46px; background: #0c0c0c; border: 1px solid var(--line2); border-radius: 8px; color: var(--tx);
  padding: 11px 14px; font: 400 16px var(--font-body); outline: none; transition: border-color .15s, box-shadow .15s; color-scheme: dark; }
.input:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.input::placeholder { color: #5d5d5d; }
.input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
select.input { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238d8d8d' stroke-width='2' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px; }
.input-icon { position: relative; }
.input-icon .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--tx3); pointer-events: none; }
.input-icon .input { padding-left: 40px; }
.money-in { position: relative; }
.money-in::before { content: '₹'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--tx3); font-size: 16px; }
.money-in .input { padding-left: 30px; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field > label, .field > .label { font-family: var(--font-head); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tx3); }
.field .hint { font-size: 12.5px; color: var(--tx3); }
.field .hint.bad { color: var(--danger); }
.field .hint a { color: var(--red-hi); cursor: pointer; text-decoration: underline; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .row2.keep { grid-template-columns: 1fr 1fr; } .row2:not(.keep) { grid-template-columns: 1fr; gap: 0; } }

/* segmented / option chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.seg.wrap { grid-auto-flow: row; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.opt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 11px 8px; min-height: 46px; text-align: center; background: #0c0c0c; border: 1px solid var(--line2);
  border-radius: 8px; cursor: pointer; color: var(--tx2); font-family: var(--font-head); font-weight: 600; font-size: 14px; letter-spacing: .06em; transition: all .15s; user-select: none; }
.opt:hover { border-color: #555; }
.opt .sub { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--tx3); letter-spacing: 0; }
.opt.on { border-color: var(--red); background: var(--red-soft); color: #fff; }
.opt.on .sub { color: var(--tx2); }
.opt.male.on { border-color: #3b82f6; background: rgba(59,130,246,.14); }
.opt.female.on { border-color: #ec4899; background: rgba(236,72,153,.14); }
.opt .ic { font-size: 1.2em; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line2); background: var(--s1); color: var(--tx2);
  font-family: var(--font-head); font-weight: 600; font-size: 14px; letter-spacing: .06em; cursor: pointer; transition: all .15s; min-height: 38px; }
.chip:hover { border-color: #666; }
.chip.on { background: var(--red); border-color: var(--red); color: #fff; }
.chip .n { font-size: 12px; opacity: .75; font-weight: 700; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

/* ─── CARDS / STATS ─── */
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-head h3 { font-family: var(--font-head); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--tx2); }
.card-head .grow { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.stat { background: var(--s1); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--red)); border-radius: var(--radius); padding: 16px 18px; text-align: left; cursor: default; color: inherit; font: inherit; }
button.stat, a.stat { cursor: pointer; transition: background .15s, transform .15s; text-decoration: none; display: block; }
button.stat:hover, a.stat:hover { background: var(--s2); transform: translateY(-2px); }
.stat .v { font-family: var(--font-display); font-size: 2.7rem; line-height: 1; letter-spacing: .02em; }
.stat .l { font-family: var(--font-head); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--tx3); margin-top: 6px; }
.stat .s { font-size: 12.5px; color: var(--tx3); margin-top: 2px; }
.stat.green { --c: var(--green); } .stat.amber { --c: var(--amber); } .stat.danger { --c: var(--danger); } .stat.blue { --c: var(--blue); } .stat.violet { --c: var(--violet); }
@media (max-width: 560px) { .stats { grid-template-columns: 1fr 1fr; gap: 10px; } .stat { padding: 13px 14px; } .stat .v { font-size: 2.2rem; } }

/* big launcher cards on Home */
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.door { display: flex; align-items: center; gap: 16px; padding: 18px 20px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; cursor: pointer; text-align: left;
  transition: border-color .15s, transform .15s, background .15s; color: inherit; font: inherit; width: 100%; }
.door:hover { border-color: var(--red); background: var(--s2); transform: translateY(-2px); }
.door .d-ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--red-soft); color: var(--red-hi); font-size: 1.5rem; flex-shrink: 0; }
.door .d-t { font-family: var(--font-head); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.door .d-s { color: var(--tx3); font-size: 13.5px; }
.door .go { margin-left: auto; color: var(--tx3); }

.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.quick .btn { min-height: 60px; font-size: 15px; justify-content: flex-start; padding: 12px 18px; white-space: normal; text-align: left; line-height: 1.15; }
.quick .btn .ic { font-size: 1.5em; }

/* ─── MEMBER ROWS ─── */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .input-icon { flex: 1 1 260px; min-width: 0; }
.toolbar select.input { width: auto; flex: 0 0 auto; min-width: 150px; }
@media (max-width: 640px) { .toolbar select.input { flex: 1 1 130px; min-width: 0; } .hide-m { display: none !important; } }
.kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 11px var(--font-head); color: var(--tx3); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 6px; pointer-events: none; }
.list-meta { color: var(--tx3); font-size: 13px; margin: 6px 2px 10px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.mlist { display: flex; flex-direction: column; gap: 8px; }
.mrow { --st: var(--green); display: grid; grid-template-columns: 44px minmax(150px,1.3fr) minmax(110px,.8fr) minmax(165px,1fr) minmax(86px,auto) auto; gap: 14px; align-items: center;
  padding: 13px 16px; background: var(--s1); border: 1px solid var(--line); border-left: 3px solid var(--st); border-radius: var(--radius); cursor: pointer; transition: background .15s, border-color .15s; }
.mrow:hover { background: var(--s2); border-color: #3a3a3a; border-left-color: var(--st); }
.mrow.st-expired { --st: var(--danger); } .mrow.st-soon { --st: var(--amber); } .mrow.st-active { --st: var(--green); }
.av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.3rem; color: #fff; flex-shrink: 0; letter-spacing: 0; }
.av.male { background: #2563eb; } .av.female { background: #d6336c; } .av.lg { width: 60px; height: 60px; font-size: 1.9rem; } .av.sm { width: 34px; height: 34px; font-size: 1.05rem; }
.mcell { min-width: 0; }
.mcell b { display: block; font-family: var(--font-head); font-weight: 700; font-size: 17px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcell small { display: block; color: var(--tx3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcell.exp b { font-size: 15px; }
.mact { display: flex; gap: 6px; justify-content: flex-end; }
.badge { display: inline-block; font-family: var(--font-head); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 9px; border-radius: 4px; margin-top: 3px; white-space: nowrap; }
.badge.expired { background: var(--danger-soft); color: var(--danger); } .badge.soon { background: var(--amber-soft); color: var(--amber); } .badge.active { background: var(--green-soft); color: var(--green); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-family: var(--font-head); font-weight: 700; font-size: 13px; letter-spacing: .04em; white-space: nowrap; }
.pill.due { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(255,80,80,.3); }
.pill.paid { background: var(--green-soft); color: var(--green); }
.pill.none { background: #1f1f1f; color: var(--tx3); }
.pill.part { background: var(--amber-soft); color: var(--amber); }
@media (max-width: 1180px) {
  .mrow { grid-template-columns: 42px 1fr auto; grid-template-areas: "av name exp" "av plan plan" "due due act"; gap: 6px 12px; padding: 13px 14px; }
  .mrow > .av { grid-area: av; align-self: start; } .mrow > .c-name { grid-area: name; } .mrow > .c-plan { grid-area: plan; } .mrow > .c-exp { grid-area: exp; text-align: right; }
  .mrow > .c-due { grid-area: due; align-self: center; } .mrow > .mact { grid-area: act; }
  .mrow > .c-exp .badge { margin-top: 2px; }
  .mrow > .c-due:empty { display: none; }
  .mrow > .c-plan { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; }
  .mrow > .c-plan b, .mrow > .c-plan small { display: inline; font-size: 14px; }
}
.empty { text-align: center; padding: 54px 20px; color: var(--tx3); }
.empty .big { font-size: 2.6rem; display: block; margin-bottom: 8px; opacity: .8; }
.empty b { display: block; color: var(--tx2); font-family: var(--font-head); font-size: 18px; letter-spacing: .06em; margin-bottom: 4px; text-transform: uppercase; }
.fab { display: none; }
@media (max-width: 960px) {
  .fab { display: flex; position: fixed; right: 16px; bottom: calc(var(--bar-h) + 18px + var(--safe-b)); z-index: 80; width: 56px; height: 56px; border-radius: 50%; border: 0;
    background: var(--red); color: #fff; align-items: center; justify-content: center; box-shadow: 0 8px 26px var(--red-glow), 0 2px 8px rgba(0,0,0,.5); cursor: pointer; font-size: 1.6rem; }
  .fab:active { transform: scale(.94); }
}

/* mini lists (Home) */
.mini { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }

/* ─── text / number / date helpers ─── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
function inrShort(n) {
  n = Math.round(n);
  if (n >= 100000) { const v = n / 100000; return '₹' + (v >= 10 || Number.isInteger(v) ? Math.round(v) : v.toFixed(1)) + 'L'; }
  if (n >= 1000) { const v = n / 1000; return '₹' + (v >= 10 || Number.isInteger(v) ? Math.round(v) : v.toFixed(1)) + 'k'; }
  return '₹' + n;
}
const pad = n => String(n).padStart(2, '0');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const isoUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fromUTC = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (s, n) => fromUTC(isoUTC(s) + n * 86400000);
const daysBetween = (a, b) => Math.round((isoUTC(b) - isoUTC(a)) / 86400000);
// Same month-end clamping as the server (31 Jan + 1 month = 28 Feb), so the preview matches what gets saved.
function addMonths(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const idx = m - 1 + n, yy = y + Math.floor(idx / 12), mm = ((idx % 12) + 12) % 12 + 1;
  const last = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  return `${yy}-${pad(mm)}-${pad(Math.min(d, last))}`;
}
const planEnd = (s, months) => addDays(addMonths(s, months), -1);
function fmtDate(s) { if (!s) return '—'; const [y, m, d] = s.split('-').map(Number); return `${pad(d)} ${MON[m - 1]} ${y}`; }
function fmtShort(s) { if (!s) return '—'; const [, m, d] = s.split('-').map(Number); return `${d} ${MON[m - 1]}`; }
function fmtLong(s) { return new Date(isoUTC(s)).toLocaleDateString('en-IN', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
const monthStart = s => s.slice(0, 7) + '-01';
const monthEnd = s => addDays(addMonths(monthStart(s), 1), -1);
const firstName = n => String(n).trim().split(/\s+/)[0];
const initial = n => (String(n).trim().charAt(0) || '?').toUpperCase();
const debounce = (fn, ms = 180) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ─── CSV helpers ─── */
function csvCell(v) {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // stop spreadsheet formula injection from a name like "=HYPERLINK(...)"
  return `"${s.replace(/"/g, '""')}"`;
}
const toCsv = rows => '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const downloadCsv = (rows, filename) => downloadBlob(new Blob([toCsv(rows)], { type: 'text/csv;charset=utf-8;' }), filename);

/* ═══ API ═══ */
class ApiErr extends Error {
  constructor(message, status = 0, data = null) { super(message); this.status = status; this.data = data; }
}
async function api(url, opts = {}) {
  const init = { method: opts.method || 'GET', headers: {}, credentials: 'same-origin' };
  if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  if (opts.form) { init.body = opts.form; }                      // file uploads (browser sets the multipart header)
  let res;
  try { res = await fetch(url, init); }
  catch (e) { throw new ApiErr('Could not reach the server. Is it running?', 0); }
  let data = null;
  try { data = (opts.raw && res.ok) ? null : await res.json(); } catch (e) { /* non-JSON body */ }
  if (res.status === 401 && !opts.noAuthRedirect) { sessionExpired(); throw new ApiErr('Your session expired — please log in again.', 401); }
  if (!res.ok) {
    if (res.status === 403 && data && data.code === 'revenue_locked' && !opts._retried) {
      if (await promptPin()) return api(url, { ...opts, _retried: true });
      throw new ApiErr('Revenue is locked.', 403, data);
    }
    throw new ApiErr((data && data.error) || `Server error (${res.status})`, res.status, data);
  }
  return opts.raw ? res : data;
}
const apiGet = url => api(url);
const apiSend = (method, url, body) => api(url, { method, body: body ?? {} });

async function refreshData() {
  const d = await api('/api/bootstrap');
  S.today = d.today; S.members = d.members; S.prices = d.plan_prices; S.meta = d.meta_configured;

}

/* ═══ TOASTS ═══ */
function toast(msg, type = 'ok', ms = 3600) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span style="flex:1">${esc(msg)}</span>`;
  $('#toastRoot').appendChild(el);
  while ($('#toastRoot').children.length > 3) $('#toastRoot').firstChild.remove();
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  el.addEventListener('click', kill);
  setTimeout(kill, type === 'err' ? Math.max(ms, 5200) : ms);
}
const toastErr = e => toast(e && e.message ? e.message : 'Something went wrong.', 'err');

/* ═══ MODALS ═══ */
const modalStack = [];
function openModal({ title = '', sub = '', head = null, body = '', foot = '', size = '', drawer = false, sticky = false, onClose = null }) {
  const ov = document.createElement('div');
  ov.className = 'overlay' + (drawer ? ' drawer' : '');
  const headHtml = head !== null ? head : `<div style="flex:1;min-width:0"><h2>${title}</h2>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
  ov.innerHTML = `<div class="modal ${size} ${drawer ? 'drawer' : ''}" role="dialog" aria-modal="true">
      <div class="modal-head">${headHtml}<button type="button" class="x-btn" data-close aria-label="Close">${ic('x')}</button></div>
      <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  const prevFocus = document.activeElement;
  const h = {
    el: ov, modal: $('.modal', ov), body: $('.modal-body', ov),
    $: s => $(s, ov), $$: s => $$(s, ov),
    setBody(html) { h.body.innerHTML = html; },
    setFoot(html) { let f = $('.modal-foot', ov); if (!f) { f = document.createElement('div'); f.className = 'modal-foot'; h.modal.appendChild(f); } f.innerHTML = html; },
    close(result) {
      if (h.closed) return; h.closed = true;
      const i = modalStack.indexOf(h); if (i >= 0) modalStack.splice(i, 1);
      ov.remove();
      if (!modalStack.length) document.body.style.overflow = '';
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) try { prevFocus.focus({ preventScroll: true }); } catch (e) { /* noop */ }
      if (onClose) onClose(result);
    },
  };
  let downOnOverlay = false;
  ov.addEventListener('mousedown', e => { downOnOverlay = e.target === ov; });
  ov.addEventListener('click', e => { if (e.target === ov && downOnOverlay && !sticky) h.close(); });
  $('[data-close]', ov).addEventListener('click', () => h.close());
  $('#modalRoot').appendChild(ov);
  modalStack.push(h);
  document.body.style.overflow = 'hidden';
  const auto = $('[autofocus]', ov); if (auto) setTimeout(() => auto.focus({ preventScroll: true }), 60);
  return h;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalStack.length) { e.preventDefault(); modalStack[modalStack.length - 1].close(); }
});

function confirmBox({ title, message, okText = 'Confirm', cancelText = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    let answered = false;
    const m = openModal({
      title, size: 'sm', body: `<div style="padding-bottom:12px;color:var(--tx2)">${message}</div>`,
      foot: `<button class="btn" data-no>${esc(cancelText)}</button><button class="btn ${danger ? 'btn-danger solid' : 'btn-primary'}" data-yes>${esc(okText)}</button>`,
      onClose: () => { if (!answered) resolve(false); },
    });
    m.$('[data-no]').onclick = () => { answered = true; m.close(); resolve(false); };
    m.$('[data-yes]').onclick = () => { answered = true; m.close(); resolve(true); };
    m.$('[data-yes]').focus();
  });
}

/* ═══ REVENUE PIN PROMPT ═══ */
let pinPromise = null;
function promptPin() {
  if (pinPromise) return pinPromise;
  pinPromise = new Promise(resolve => {
    let ok = false;
    const m = openModal({
      title: 'Revenue <span>PIN</span>', sub: 'Enter the PIN to view or change revenue.', size: 'sm', sticky: true,
      body: `<form id="pinForm"><div class="field"><input class="input" id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="text-align:center;letter-spacing:.3em" autofocus>
        <div class="hint bad" id="pinErr"></div></div></form>`,
      foot: `<button class="btn" data-no>Cancel</button><button class="btn btn-primary" id="pinGo">Unlock</button>`,
      onClose: () => { pinPromise = null; resolve(ok); },
    });
    const submit = async e => {
      if (e) e.preventDefault();
      const pin = m.$('#pinInput').value.trim(); if (!pin) return;
      try { await api('/api/revenue/unlock', { method: 'POST', body: { pin }, noAuthRedirect: false }); ok = true; S.unlocked = true; m.close(); }
      catch (err) { m.$('#pinErr').textContent = err.message; m.$('#pinInput').select(); }
    };
    m.$('#pinForm').addEventListener('submit', submit);
    m.$('#pinGo').onclick = submit;
    m.$('[data-no]').onclick = () => m.close();
  });
  return pinPromise;
}

/* ═══ MEMBER PICKER (type a name or phone, pick from the list) ═══ */
function memberPicker(host, { onPick, placeholder = 'Search member by name or phone…' } = {}) {
  host.classList.add('picker');
  host.innerHTML = `<div class="input-icon">${ic('search')}<input class="input" type="text" placeholder="${esc(placeholder)}" autocomplete="off" autocapitalize="off"></div><div class="picker-list" hidden></div>`;
  const input = $('input', host), list = $('.picker-list', host);
  let items = [], hl = 0;
  const render = () => {
    const q = input.value.trim().toLowerCase();
    items = S.members.filter(m => !q || m.name.toLowerCase().includes(q) || m.phone.includes(q))
      .sort((a, b) => a.name.localeCompare(b.name)).slice(0, 40);
    hl = Math.min(hl, Math.max(0, items.length - 1));
    list.innerHTML = items.length ? items.map((m, i) => `<div class="picker-item ${i === hl ? 'hl' : ''}" data-i="${i}">${avatar(m, 'sm')}
        <div class="mcell"><b>${esc(m.name)}</b><small>+91 ${m.phone} · ${esc(m.plan_label)}</small></div>
        <span class="badge ${m.status}">${m.status === 'expired' ? 'Expired' : m.status === 'soon' ? 'Soon' : 'Active'}</span></div>`).join('')
      : `<div class="empty" style="padding:18px">No member found${q ? ` for “${esc(input.value.trim())}”` : ''}</div>`;
    list.hidden = false;
  };
  const pick = i => { const m = items[i]; if (!m) return; list.hidden = true; input.value = ''; onPick(m); };
  input.addEventListener('focus', () => { hl = 0; render(); });
  input.addEventListener('input', () => { hl = 0; render(); });
  input.addEventListener('blur', () => setTimeout(() => { list.hidden = true; }, 150));
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); hl = Math.min(items.length - 1, hl + 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(0, hl - 1); render(); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(hl); }
    else if (e.key === 'Escape' && !list.hidden) { e.stopPropagation(); list.hidden = true; }
  });
  list.addEventListener('mousedown', e => { const it = e.target.closest('[data-i]'); if (it) { e.preventDefault(); pick(+it.dataset.i); } });
  return { focus: () => input.focus(), el: input };
}

/* ─── router (hash based: #/members) ─── */
function currentRoute() {
  const r = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
  return ROUTES[r] ? r : 'home';
}
function go(r) {
  if (currentRoute() === r && location.hash) route(); else location.hash = '#/' + r;
}
function route() {
  S.route = currentRoute();
  buildNav();
  $('#fab').hidden = S.route !== 'members';
  document.title = `${ROUTES[S.route].label} · X GYM Admin`;
  const view = $('#view');
  view.style.animation = 'none'; void view.offsetWidth; view.style.animation = '';
  (RENDERERS[S.route] || RENDERERS.home)();
  window.scrollTo(0, 0);
}
function rerender() { (RENDERERS[S.route] || RENDERERS.home)(); buildNav(); }
window.addEventListener('hashchange', () => { if (!$('#app').hidden) route(); });

async function startApp() {
  $('#loginScreen').hidden = true;

const FILTERS = [
  ['all', 'All'], ['active', 'Active'], ['soon', 'Expiring soon'], ['expired', 'Expired'], ['dues', 'Dues pending'],
];
const SORTS = [
  ['attention', 'Needs attention first'], ['name', 'Name A–Z'], ['joined', 'Newest joined'], ['due', 'Highest dues'], ['validtill', 'Valid till (latest)'],
];

function memberMatches(m, u) {
  const q = u.q.trim().toLowerCase();
  if (q && !(m.name.toLowerCase().includes(q) || m.phone.includes(q.replace(/\D/g, '') || '\u0000'))) return false;
  if (u.gender && m.gender !== u.gender) return false;
  if (u.filter === 'dues') return m.due > 0;
  if (u.filter !== 'all') return m.status === u.filter;
  return true;
}
function sortMembers(list, how) {
  const order = { expired: 0, soon: 1, active: 2 };
  const by = {
    attention: (a, b) => order[a.status] - order[b.status] || (a.status === 'expired' ? b.days_left - a.days_left : a.days_left - b.days_left),
    name: (a, b) => a.name.localeCompare(b.name),
    joined: (a, b) => b.joined.localeCompare(a.joined) || a.name.localeCompare(b.name),
    due: (a, b) => b.due - a.due || a.name.localeCompare(b.name),
    validtill: (a, b) => b.expiry.localeCompare(a.expiry),
  };
  return list.sort(by[how] || by.attention);
}

function memberRow(m) {
  const dueHtml = m.due > 0 ? `<span class="pill due">${inr(m.due)} due</span>` : '';
  return `<div class="mrow st-${m.status}" data-act="open-member" data-id="${m.id}" tabindex="0" role="button" aria-label="Open ${esc(m.name)}">

}

function paintMemberList() {
  const u = S.ui.members;
  // chip counts respect search + gender but ignore the status chip itself
  const base = S.members.filter(m => memberMatches(m, { ...u, filter: 'all' }));

  base.forEach(m => { counts[m.status]++; if (m.due > 0) counts.dues++; });
  $('#mChips').innerHTML = FILTERS.map(([k, l]) => `<button class="chip ${u.filter === k ? 'on' : ''}" data-act="chip" data-f="${k}">${l}<span class="n">${counts[k]}</span></button>`).join('');

  const list = sortMembers(S.members.filter(m => memberMatches(m, u)), u.sort);

  $('#mMore').innerHTML = list.length > shown.length ? `<button class="btn" data-act="more-members">Show ${Math.min(100, list.length - shown.length)} more</button>` : '';
}

function bindSeg(root, attr, onPick) {

/**
 * Wires the plan chips, date inputs, valid-till banner and payment box.
 * st = { plan, start, expiry, getGender() }  →  returns { get(), validate() }
 */
function wirePlanPay(h, st) {
  const el = id => h.$('#' + id);
  st.method = lastMethod; st.priceTouched = false; st.paidTouched = false;
  if (st.plan !== '0' && !st.expiry) st.expiry = planEnd(st.start, +st.plan);

  const paintPlans = () => $$('[data-plan]', el('pb_plans')).forEach(o => {
    const p = o.dataset.plan;
    o.classList.toggle('on', p === st.plan);
    $('[data-pp]', o).textContent = p === '0' ? 'pick date' : inr(listPrice(st.getGender(), p));
  });
  const paintDates = () => { el('pb_start').value = st.start; el('pb_expiry').value = st.expiry; };
  const paintTill = () => {
    const t = el('pb_till');
    if (!st.start || !st.expiry) { t.className = 'till'; t.innerHTML = `<div><div class="t-l">Membership valid till</div><div class="t-d">—</div></div>`; return; }
    const days = daysBetween(st.start, st.expiry) + 1, bad = days < 1;
    t.className = 'till' + (bad ? ' bad' : '');
    t.innerHTML = `<div><div class="t-l">Membership valid till</div><div class="t-d">${bad ? 'Check the dates' : fmtDate(st.expiry)}</div></div>
      <div class="t-r">${bad ? '' : `<b>${days} day${days === 1 ? '' : 's'}</b><br>`}${esc(planName(st.plan, bad ? 0 : days))}</div>`;
  };
  const paintMoney = () => {
    const price = num(el('pb_price').value), paid = num(el('pb_paid').value), b = el('pb_balance');
    if (paid > price) { b.className = 'balance owe'; b.innerHTML = `<span>Paid is more than the price</span><span class="amt">+${inr(paid - price)}</span>`; }
    else if (paid === price) { b.className = 'balance zero'; b.innerHTML = `<span>${price === 0 ? 'No charge' : 'Paid in full'}</span><span class="amt">${price === 0 ? '—' : ic('check')}</span>`; }
    else { b.className = 'balance owe'; b.innerHTML = `<span>${paid === 0 ? 'Nothing paid — balance due' : 'Balance due'}</span><span class="amt">${inr(price - paid)}</span>`; }
    el('pb_extra').hidden = paid === 0;
  };
  const autoPrice = () => {
    if (!st.priceTouched) el('pb_price').value = st.plan === '0' ? 0 : listPrice(st.getGender(), st.plan);
    if (!st.paidTouched) el('pb_paid').value = el('pb_price').value;
  };
  const paintHint = () => {
    const hint = el('pb_hint'); if (!hint) return;
    hint.textContent = st.hint ? st.hint() : '';
  };
  const repaint = () => { paintPlans(); paintDates(); paintTill(); paintHint(); paintMoney(); };

  el('pb_paidon').value = S.today; el('pb_paidon').max = S.today;
  el('pb_price').value = 0; el('pb_paid').value = 0;
  autoPrice(); repaint();

  el('pb_plans').addEventListener('click', e => {
    const o = e.target.closest('[data-plan]'); if (!o) return;
    st.plan = o.dataset.plan;
    if (st.plan !== '0') st.expiry = planEnd(st.start, +st.plan);
    else if (!st.expiry || st.expiry < st.start) st.expiry = addDays(st.start, 29);
    st.priceTouched = false; autoPrice(); repaint();
    if (st.plan === '0') el('pb_expiry').focus();
  });
  el('pb_plans').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const o = e.target.closest('[data-plan]'); if (o) { e.preventDefault(); o.click(); } } });
  el('pb_start').addEventListener('change', e => {
    if (!e.target.value) return;
    st.start = e.target.value;
    if (st.plan !== '0') st.expiry = planEnd(st.start, +st.plan);
    repaint();
  });
  el('pb_expiry').addEventListener('change', e => { st.expiry = e.target.value; paintTill(); });
  el('pb_price').addEventListener('input', e => { digitsOnly(e.target); st.priceTouched = true; if (!st.paidTouched) el('pb_paid').value = e.target.value; paintMoney(); });
  el('pb_paid').addEventListener('input', e => { digitsOnly(e.target); st.paidTouched = true; paintMoney(); });
  $$('[data-q]', h.el).forEach(b => b.addEventListener('click', () => {
    const price = num(el('pb_price').value);
    el('pb_paid').value = b.dataset.q === 'full' ? price : b.dataset.q === 'half' ? Math.round(price / 2) : 0;
    st.paidTouched = true; paintMoney();
  }));
  bindSeg(el('pb_methods'), 'm', m => { st.method = m; });

  return {
    onGender() { autoPrice(); paintPlans(); paintMoney(); },
    repaint,
    get: () => ({
      plan: st.plan, start: st.start, expiry: st.expiry, price: num(el('pb_price').value), paid: num(el('pb_paid').value),
      method: st.method, paidOn: el('pb_paidon').value || S.today, note: el('pb_note').value.trim(),
    }),
    validate() {
      const d = this.get();
      if (!d.start || !d.expiry) return 'Pick the start and valid-till dates.';
      if (d.expiry < d.start) return 'Valid-till can’t be before the start date.';
      if (d.paid > d.price) return 'Amount paid can’t be more than the price.';
      if (d.paid > 0 && d.paidOn > S.today) return 'Payment date can’t be in the future.';
      return null;
    },
  };
}

/* ═══ ADD / EDIT MEMBER ═══ */
function openMemberForm(editId) {
  const edit = editId ? findMember(editId) : null;
  if (editId && !edit) return toast('Member not found.', 'err');
  const st = { gender: edit ? edit.gender : 'male', plan: edit ? edit.plan : '1', start: edit ? edit.joined : S.today, expiry: edit ? edit.expiry : '', getGender: () => st.gender };

  const detailsHtml = `
    <div class="field"><label for="f_name">Full name</label><input class="input" id="f_name" maxlength="80" placeholder="e.g. Rahul Sharma" autocomplete="off" value="${edit ? esc(edit.name) : ''}" ${edit ? '' : 'autofocus'}></div>
    <div class="field"><label for="f_phone">Phone number</label><input class="input" id="f_phone" type="tel" inputmode="numeric" maxlength="14" placeholder="10-digit mobile number" autocomplete="off" value="${edit ? edit.phone : ''}"><div class="hint" id="f_phoneHint"></div></div>
    <div class="field"><label>Gender</label><div class="seg" id="f_gender"><div class="opt male ${st.gender === 'male' ? 'on' : ''}" role="button" tabindex="0" data-g="male">Male</div><div class="opt female ${st.gender === 'female' ? 'on' : ''}" role="button" tabindex="0" data-g="female">Female</div></div></div>`;

  const body = edit ? `
    <div class="sec"><div class="sec-t"><span class="sec-n">1</span>Member details</div>${detailsHtml}</div>
    <div class="sec"><div class="sec-t"><span class="sec-n">2</span>Membership dates <small>— corrections only</small></div>
      <div class="notice warn">To <b>extend</b> a membership use <b>Renew</b> — it also records the payment. Use this only to fix a mistake.</div>
      <div class="row2"><div class="field"><label for="e_joined">Joined on</label><input class="input" type="date" id="e_joined" value="${edit.joined}"></div>
      <div class="field"><label for="e_plan">Current plan</label><select class="input" id="e_plan">${['1', '3', '6', '12', '0'].map(p => `<option value="${p}" ${p === edit.plan ? 'selected' : ''}>${PLAN_LABELS[p]}</option>`).join('')}</select></div></div>
      <div class="field"><label for="e_expiry">Valid till</label><input class="input" type="date" id="e_expiry" value="${edit.expiry}"></div>
    </div>` : `
    <div class="sec"><div class="sec-t"><span class="sec-n">1</span>Member details</div>${detailsHtml}</div>
    <div class="sec"><div class="sec-t"><span class="sec-n">2</span>Membership <small>— plan &amp; validity</small></div>${planGridHtml()}${datesHtml()}</div>
    <div class="sec"><div class="sec-t"><span class="sec-n">3</span>Payment <small>— can also be added later</small></div>${payHtml()}</div>`;

  const h = openModal({
    title: edit ? 'Edit <span>member</span>' : 'Add <span>member</span>', sticky: true, body,
    foot: `<button class="btn" type="button" data-cancel>Cancel</button><button class="btn btn-primary" type="button" id="f_save">${ic('check')}${edit ? 'Save changes' : 'Save member'}</button>`,
  });
  const ctl = edit ? null : wirePlanPay(h, st);
  bindSeg(h.$('#f_gender'), 'g', g => { st.gender = g; if (ctl) ctl.onGender(); });
  h.$('[data-cancel]').onclick = () => h.close();

  // live duplicate-phone check against the members we already have
  const phoneInput = h.$('#f_phone'), hint = h.$('#f_phoneHint');
  const checkPhone = () => {
    const p = phoneInput.value.replace(/\D/g, '').slice(-10);
    const dup = p.length === 10 && S.members.find(m => m.phone === p && (!edit || m.id !== edit.id));
    hint.className = dup ? 'hint bad' : 'hint';
    hint.innerHTML = dup ? `Already registered: <b>${esc(dup.name)}</b> (valid till ${fmtDate(dup.expiry)}). <a data-dup="${dup.id}">Open profile</a>` : '';
  };
  phoneInput.addEventListener('input', checkPhone);
  hint.addEventListener('click', e => { const a = e.target.closest('[data-dup]'); if (a) { h.close(); openProfile(a.dataset.dup); } });

  h.$('#f_save').onclick = async () => {
    const name = h.$('#f_name').value.trim(), phone = phoneInput.value.replace(/\D/g, '').slice(-10);
    if (!name) { h.$('#f_name').classList.add('invalid'); h.$('#f_name').focus(); return toast('Please enter the member’s name.', 'err'); }
    h.$('#f_name').classList.remove('invalid');
    if (phone.length !== 10) { phoneInput.classList.add('invalid'); phoneInput.focus(); return toast('Enter a valid 10-digit phone number.', 'err'); }
    phoneInput.classList.remove('invalid');
    const btn = h.$('#f_save'); btn.disabled = true;
    try {
      if (edit) {
        const exp = h.$('#e_expiry').value, joined = h.$('#e_joined').value;
        if (!joined || !exp) throw new ApiErr('Pick the joined and valid-till dates.');
        const d = await apiSend('PUT', `/api/members/${edit.id}`, { name, phone, gender: st.gender, plan: h.$('#e_plan').value, start: joined, expiry: exp });
        h.close(); toast('Member updated.'); await changed(d);
      } else {
        const bad = ctl.validate(); if (bad) throw new ApiErr(bad);
        const d = ctl.get();
        const res = await apiSend('POST', '/api/members', { name, phone, gender: st.gender, plan: d.plan, start: d.start, expiry: d.expiry, price: d.price, paid: d.paid, method: d.method, paid_on: d.paidOn, note: d.note });
        lastMethod = d.method; h.close(); await changed(res);
        showSuccess({ m: res, headline: 'Member added', paid: d.paid, what: `${res.plan_label} membership` });
      }
    } catch (e) {
      if (e.data && e.data.code === 'duplicate_phone') {
        hint.className = 'hint bad';
        hint.innerHTML = `${esc(e.message)} ${e.data.existing_id ? `<a data-dup="${e.data.existing_id}">Open profile</a>` : ''}`;
        phoneInput.classList.add('invalid'); phoneInput.focus();
      }
      toastErr(e);
    } finally { btn.disabled = false; }
  };
  h.$('#f_name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); phoneInput.focus(); } });
}

/* ═══ RENEW / EXTEND ═══ */
function openRenew(id) {
  const m = findMember(id);
  if (!m) return toast('Member not found.', 'err');
  const stillValid = m.expiry >= S.today;
  const start = stillValid ? addDays(m.expiry, 1) : S.today;
  const st = { plan: m.plan === '0' ? '1' : m.plan, start, expiry: '', getGender: () => m.gender };
  st.hint = () => st.start === start
    ? (stillValid ? `Continues right after the current membership ends on ${fmtDate(m.expiry)}.` : `Starts today — the previous membership ended ${fmtDate(m.expiry)}.`)
    : 'Custom start date.';

  const statusNote = stillValid
    ? `<div class="notice good">Currently valid till <b>${fmtDate(m.expiry)}</b> (${m.days_left === 0 ? 'last day today' : m.days_left + ' day' + (m.days_left === 1 ? '' : 's') + ' left'}). The new period is added <b>after</b> it — no days are lost.</div>`
    : `<div class="notice warn">Membership expired <b>${-m.days_left} day${m.days_left === -1 ? '' : 's'} ago</b> (${fmtDate(m.expiry)}). The new period starts today.</div>`;
  const dueNote = m.due > 0 ? `<div class="notice bad">${esc(firstName(m.name))} still owes <b>${inr(m.due)}</b> from earlier. Collect it from their profile → “Collect dues”.</div>` : '';

  const h = openModal({
    title: 'Renew <span>membership</span>', sub: `${esc(m.name)} · +91 ${m.phone}`, sticky: true,
    body: `${statusNote}${dueNote}
      <div class="sec"><div class="sec-t"><span class="sec-n">1</span>Choose plan <small>— or Custom for any number of days</small></div>${planGridHtml()}${datesHtml()}</div>
      <div class="sec"><div class="sec-t"><span class="sec-n">2</span>Payment</div>${payHtml()}</div>`,
    foot: `<button class="btn" type="button" data-cancel>Cancel</button><button class="btn btn-primary" type="button" id="r_save">${ic('renew')}Renew membership</button>`,
  });
  const ctl = wirePlanPay(h, st);
  h.$('[data-cancel]').onclick = () => h.close();
  h.$('#r_save').onclick = async () => {
    const bad = ctl.validate(); if (bad) return toast(bad, 'err');
    const d = ctl.get(), btn = h.$('#r_save'); btn.disabled = true;
    try {
      const res = await apiSend('POST', `/api/members/${id}/renew`, { plan: d.plan, start: d.start, expiry: d.expiry, price: d.price, paid: d.paid, method: d.method, paid_on: d.paidOn, note: d.note });
      lastMethod = d.method; h.close(); await changed(res);
      showSuccess({ m: res, headline: 'Membership renewed', paid: d.paid, what: `${res.memberships[0].plan_label} renewal` });
    } catch (e) { toastErr(e); } finally { btn.disabled = false; }
  };
}

/* ═══ SUCCESS SHEET (after add / renew) — with a one-tap WhatsApp receipt ═══ */
function showSuccess({ m, headline, paid, what }) {
  const dueLine = m.due > 0 ? `<span class="bad-t">Balance pending: <b>${inr(m.due)}</b></span>` : `<span class="ok-t">No balance pending</span>`;
  const h = openModal({
    title: '', size: 'sm', head: '<div style="flex:1"></div>',
    body: `<div class="center" style="padding-bottom:14px">
      <div class="success-ic">${ic('check')}</div>
      <h2 style="font-size:2.2rem;margin-bottom:4px">${esc(headline)}</h2>
      <div style="font-family:var(--font-head);font-weight:700;font-size:20px">${esc(m.name)}</div>
      <div class="till" style="margin:16px 0 10px;justify-content:center;text-align:center"><div><div class="t-l">Valid till</div><div class="t-d">${fmtDate(m.expiry)}</div></div></div>
      <div class="muted" style="font-size:14px">${paid > 0 ? `Received <b style="color:var(--tx)">${inr(paid)}</b> · ` : ''}${dueLine}</div></div>`,
    foot: `<a class="btn btn-wa" href="${waLink(m.phone, waReceiptText(m, paid, what))}" target="_blank" rel="noopener">${ic('chat')}Send WhatsApp receipt</a>
           <button class="btn" data-prof>View profile</button><button class="btn btn-primary" data-done>Done</button>`,
  });
  h.$('[data-done]').onclick = () => h.close();
  h.$('[data-prof]').onclick = () => { h.close(); openProfile(m.id); };
}

let profile = null;   // { id, h, detail, paint(), reload() } while the profile drawer is open

// Called after anything changes: refresh numbers + redraw the page behind + update an open profile.

const NOTE_IDEAS = {
  membership: [],
  personal_training: ['PT – 1 month', 'PT – 12 sessions', 'PT – single session', 'Diet plan'],
  products: ['Whey protein', 'Protein shake', 'Energy drink', 'Water bottle', 'Gym gloves', 'Shaker', 'Day pass'],
  other: ['Locker rent', 'Day pass', 'Registration', 'Event / camp'],
};

/* ═══ RECORD A PAYMENT / SALE ═══
   opts: { memberId?, category? } — from a profile it's pre-filled; from Home / Revenue it starts empty */
function openPayment(opts = {}) {
  const st = { member: opts.memberId ? findMember(opts.memberId) : null, category: opts.category || null, method: lastMethod };
  if (!st.category) st.category = (st.member && st.member.due > 0) ? 'membership' : 'products';
  if (st.category === 'membership' && !(st.member && st.member.due > 0)) st.category = 'products';

  const catOpt = k => `<div class="opt" role="button" tabindex="0" data-c="${k}"><span><span class="cat-dot cat-${k}" style="display:inline-block;margin-right:6px"></span>${k === 'membership' ? 'Membership dues' : CATS[k].short}</span></div>`;
  const h = openModal({
    title: 'Record <span>payment</span>', sub: 'Money received — a sale, a trainer fee, or dues.', sticky: true,
    body: `
      <div class="field"><label>What is it for?</label><div class="seg wrap" id="pp_cats">${CAT_KEYS.map(catOpt).join('')}</div><div class="hint" id="pp_cathint"></div></div>
      <div class="field" id="pp_memberField"><label id="pp_memberLabel">Member</label><div id="pp_pickHost"></div><div id="pp_picked"></div></div>
      <div class="field" id="pp_walkField"><label for="pp_name">Customer name <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label><input class="input" id="pp_name" maxlength="80" placeholder="Walk-in customer" autocomplete="off"></div>
      <div id="pp_dueInfo"></div>
      <div class="row2 keep">${moneyField('pp_amount', 'Amount', '', 'autofocus')}<div class="field"><label for="pp_date">Date</label><input class="input" type="date" id="pp_date"></div></div>
      <div class="quickamts" id="pp_quick" style="margin:-6px 0 12px" hidden><button type="button" data-q="full">Full dues</button><button type="button" data-q="half">Half</button></div>
      <div class="field"><label>Paid via</label>${methodSeg('pp_methods', st.method)}</div>
      <div class="field"><label for="pp_note">Note <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label><input class="input" id="pp_note" maxlength="200" list="pp_ideas" placeholder="e.g. Whey protein"><datalist id="pp_ideas"></datalist></div>`,
    foot: `<button class="btn" type="button" data-cancel>Cancel</button><button class="btn btn-primary" type="button" id="pp_save">${ic('check')}Save payment</button>`,
  });
  const el = id => h.$('#' + id);
  el('pp_date').value = S.today; el('pp_date').max = S.today;
  h.$('[data-cancel]').onclick = () => h.close();

  const picker = memberPicker(el('pp_pickHost'), { onPick: m => { st.member = m; if (m.due > 0 && st.category !== 'membership' && !el('pp_amount').value) { /* keep user's choice */ } paint(); } });

  function paint() {
    const isM = st.category === 'membership';
    $$('#pp_cats .opt', h.el).forEach(o => {
      o.classList.toggle('on', o.dataset.c === st.category);
      const dis = o.dataset.c === 'membership' && !(st.member && st.member.due > 0);
      o.style.opacity = dis ? '.4' : ''; o.dataset.disabled = dis ? '1' : '';
    });
    el('pp_cathint').textContent = isM ? '' : (st.member && st.member.due > 0 ? `Tip: ${firstName(st.member.name)} has ${inr(st.member.due)} dues — choose “Membership dues” to clear them.` : '');
    // member selector
    el('pp_memberLabel').innerHTML = isM ? 'Member' : 'Member <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional — leave empty for a walk-in)</span>';
    el('pp_pickHost').hidden = !!st.member;
    el('pp_picked').innerHTML = st.member ? `<div class="picked">${avatar(st.member, 'sm')}<div class="mcell"><b>${esc(st.member.name)}</b><small>+91 ${st.member.phone}${st.member.due > 0 ? ` · <span class="bad-t">${inr(st.member.due)} due</span>` : ''}</small></div>
      ${opts.memberId ? '' : `<button class="btn btn-sm btn-icon" type="button" data-clear aria-label="Remove member">${ic('x')}</button>`}</div>` : '';
    el('pp_walkField').hidden = !!st.member || isM;
    // dues helper
    const due = st.member ? st.member.due : 0;
    el('pp_dueInfo').innerHTML = isM ? (st.member
      ? (due > 0 ? `<div class="notice bad">${esc(firstName(st.member.name))} owes <b>${inr(due)}</b> for membership.</div>` : `<div class="notice">No membership dues. To add a new period, use <b>Renew</b> instead.</div>`)
      : `<div class="notice">Choose the member whose dues you’re collecting.</div>`) : '';
    el('pp_quick').hidden = !(isM && due > 0);
    const ideas = NOTE_IDEAS[st.category] || [];
    el('pp_ideas').innerHTML = ideas.map(i => `<option value="${esc(i)}">`).join('');
    el('pp_note').placeholder = ideas.length ? `e.g. ${ideas[0]}` : '';
  }
  bindSeg(el('pp_cats'), 'c', (c, o) => {
    if (o.dataset.disabled) { toast('Pick a member who has membership dues first.', 'info'); $$('#pp_cats .opt', h.el).forEach(x => x.classList.toggle('on', x.dataset.c === st.category)); return; }
    st.category = c;
    if (c === 'membership' && st.member && !el('pp_amount').value) el('pp_amount').value = st.member.due;
    paint();
  });
  bindSeg(el('pp_methods'), 'm', m => { st.method = m; });
  el('pp_picked').addEventListener('click', e => {
    if (e.target.closest('[data-clear]')) { st.member = null; if (st.category === 'membership') st.category = 'products'; paint(); setTimeout(() => picker.focus(), 30); }
  });
  el('pp_amount').addEventListener('input', e => digitsOnly(e.target));
  $$('#pp_quick [data-q]', h.el).forEach(b => b.onclick = () => { const d = st.member.due; el('pp_amount').value = b.dataset.q === 'full' ? d : Math.round(d / 2); });
  paint();
  if (st.category === 'membership' && st.member) el('pp_amount').value = st.member.due;

  el('pp_save').onclick = async () => {
    const amount = num(el('pp_amount').value);
    if (amount <= 0) { el('pp_amount').classList.add('invalid'); el('pp_amount').focus(); return toast('Enter the amount received.', 'err'); }
    el('pp_amount').classList.remove('invalid');
    if (st.category === 'membership') {
      if (!st.member) return toast('Choose the member first.', 'err');
      if (amount > st.member.due) return toast(`Only ${inr(st.member.due)} is due for ${firstName(st.member.name)}.`, 'err');
    }
    const btn = el('pp_save'); btn.disabled = true;
    try {
      const res = await apiSend('POST', '/api/payments', {
        category: st.category, amount, method: st.method, paid_on: el('pp_date').value || S.today, note: el('pp_note').value.trim(),
        member_id: st.member ? st.member.id : null, payer_name: el('pp_name').value.trim(),
      });
      lastMethod = st.method; h.close();
      toast(`${inr(amount)} recorded${st.member ? ' for ' + st.member.name : ''}.`);
      await changed(res.member);
    } catch (e) { toastErr(e); } finally { btn.disabled = false; }
  };
}

async function deletePayment(p) {
  const ok = await confirmBox({ title: 'Delete <span>payment?</span>', danger: true, okText: 'Delete',
    message: `Remove the <b>${inr(p.amount)}</b> ${esc(p.category_label.toLowerCase())} payment from <b>${esc(p.name)}</b> on ${fmtDate(p.paid_on)}?<br><span class="muted">This lowers your revenue${p.category === 'membership' ? ' and puts the amount back as dues' : ''}.</span>` });
  if (!ok) return;
  try {
    const res = await apiSend('DELETE', `/api/payments/${p.id}`);
    toast('Payment deleted.'); await changed(res.member); if (!res.member) rerender();
  } catch (e) { if (e.status !== 403) toastErr(e); }
}

/* ═══ MEMBER PROFILE DRAWER ═══ */
async function openProfile(id) {
  if (profile && !profile.h.closed) { if (profile.id === id) { profile.reload(); return; } profile.h.close(); }

const PRESETS = [['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['last_month', 'Last month'], ['30d', 'Last 30 days'], ['fy', 'This FY'], ['custom', 'Custom']];
const REV = { summary: null, tx: { items: [], count: 0, total: 0 }, range: null, token: 0 };

const mondayOffset = s => (new Date(isoUTC(s)).getUTCDay() + 6) % 7;       // days since Monday

/** The chosen period + the period to compare it with (fair like-for-like). */
function revenueRange(u) {
  const t = S.today;
  switch (u.preset) {
    case 'today': return { from: t, to: t, cFrom: addDays(t, -1), cTo: addDays(t, -1), label: 'Today', cLabel: 'yesterday' };
    case 'week': { const f = addDays(t, -mondayOffset(t)); return { from: f, to: t, cFrom: addDays(f, -7), cTo: addDays(t, -7), label: 'This week', cLabel: 'the same days last week' }; }
    case 'month': {
      const f = monthStart(t), pf = addMonths(f, -1), pEnd = monthEnd(pf), pt = addDays(pf, daysBetween(f, t));
      return { from: f, to: t, cFrom: pf, cTo: pt > pEnd ? pEnd : pt, label: 'This month', cLabel: 'the same days last month' };
    }
    case 'last_month': {
      const f = addMonths(monthStart(t), -1), pf = addMonths(f, -1);
      return { from: f, to: monthEnd(f), cFrom: pf, cTo: monthEnd(pf), label: 'Last month', cLabel: 'the month before' };
    }
    case '30d': return { from: addDays(t, -29), to: t, cFrom: addDays(t, -59), cTo: addDays(t, -30), label: 'Last 30 days', cLabel: 'the 30 days before' };
    case 'fy': {
      const y = +t.slice(0, 4), fy = +t.slice(5, 7) >= 4 ? y : y - 1, f = `${fy}-04-01`;
      return { from: f, to: t, cFrom: addMonths(f, -12), cTo: addMonths(t, -12), label: `FY ${fy}–${String(fy + 1).slice(2)}`, cLabel: 'the same period last year' };
    }
    default: {
      let from = u.from || monthStart(t), to = u.to || t;
      if (to < from) [from, to] = [to, from];
      const len = daysBetween(from, to) + 1;
      return { from, to, cFrom: addDays(from, -len), cTo: addDays(from, -1), label: 'Custom range', cLabel: 'the period before' };
    }
  }
}

function deltaPill(cur, prev, cLabel) {
  if (prev === null || prev === undefined) return '';
  if (prev === 0 && cur === 0) return `<span class="delta flat">— no change</span>`;
  if (prev === 0) return `<span class="delta up">${ic('up')}New vs ${cLabel}</span>`;
  const pct = Math.round(((cur - prev) / prev) * 100);
  if (pct === 0) return `<span class="delta flat">same as ${cLabel}</span>`;
  return `<span class="delta ${pct > 0 ? 'up' : 'down'}">${ic(pct > 0 ? 'up' : 'down')}${Math.abs(pct)}% vs ${cLabel}</span>`;
}

function paintRevenue() {
  const d = REV.summary, r = REV.range, c = d.current, host = $('#rvBody');
  if (!host) return;
  const total = c.total;
  const pct = v => total ? Math.round((v / total) * 100) : 0;
  const prevTotal = d.previous ? d.previous.total : null;

  const catCards = CAT_KEYS.map(k => `<div class="cat-card cat-${k}" style="--cc:${CATS[k].color}">
      <div class="l"><span class="cat-dot cat-${k}"></span>${CATS[k].short}</div><div class="v">${inr(c.by_category[k].amount)}</div>
      <div class="s">${pct(c.by_category[k].amount)}% · ${c.by_category[k].count} payment${c.by_category[k].count === 1 ? '' : 's'}</div></div>`).join('');

  const split = total ? `<div class="split">${CAT_KEYS.map(k => c.by_category[k].amount ? `<i style="width:${(c.by_category[k].amount / total) * 100}%;background:${CATS[k].color}" title="${CATS[k].label}"></i>` : '').join('')}</div>` : '';
  const brk = (keys, map, colorOf) => keys.map(k => { const v = map[k].amount;
    return `<div class="brk-row"><div class="top"><span class="nm"><span class="cat-dot" style="background:${colorOf(k)}"></span>${k in CATS ? CATS[k].label : METHODS[k].label}</span><b>${inr(v)}<span class="pct">${pct(v)}%</span></b></div>
      <div class="bar"><i style="width:${pct(v)}%;background:${colorOf(k)}"></i></div></div>`; }).join('');
  const methodKeys = METHOD_KEYS.filter(k => c.by_method[k].amount > 0 || ['cash', 'upi', 'card'].includes(k));

  const dues = d.dues;
  const duesCard = dues.count ? `<div class="h-sec">Pending membership dues <span class="grow"></span><span class="bad-t" style="font-size:15px;font-family:var(--font-head);letter-spacing:.04em">${inr(dues.total)} from ${dues.count} member${dues.count === 1 ? '' : 's'}</span></div>
    <div class="card dues-card">${dues.members.slice(0, 6).map(m => { const mm = findMember(m.id);

        <button class="btn btn-sm btn-primary" data-act="collect" data-id="${m.id}">Collect</button></div>`; }).join('')}
      ${dues.count > 6 ? `<div style="padding-top:10px"><a class="link" data-act="members-filter" data-f="dues">See all ${dues.count} →</a></div>` : ''}</div>` : '';

  host.innerHTML = `
    <div class="hero">
      <div class="total-card">
        <div class="label">${esc(r.label)} · ${r.from === r.to ? fmtDate(r.from) : `${fmtDate(r.from)} – ${fmtDate(r.to)}`}</div>
        <div class="amt">${inr(total)}</div>
        ${deltaPill(total, prevTotal, esc(r.cLabel))}
        <div class="chips2"><span><b>${c.count}</b> payment${c.count === 1 ? '' : 's'}</span><span><b>${d.joinings}</b> new member${d.joinings === 1 ? '' : 's'}</span><span><b>${d.renewals}</b> renewal${d.renewals === 1 ? '' : 's'}</span></div>
      </div>
      <div class="cats">${catCards}</div>
    </div>
    ${d.series.points.length > 1 ? `<div class="card"><div class="card-head"><h3>${d.series.granularity === 'day' ? 'Daily' : 'Monthly'} collections</h3></div><div class="chart-wrap" id="chartWrap">${chartSvg(d.series)}<div class="tip" id="chartTip"></div></div>
      <div class="legend">${CAT_KEYS.map(k => `<span><i style="background:${CATS[k].color}"></i>${CATS[k].short}</span>`).join('')}</div></div>` : ''}
    <div class="two-col" style="margin-top:14px">
      <div class="card"><div class="card-head"><h3>By source</h3></div>${split}<div class="brk">${brk(CAT_KEYS, c.by_category, k => CATS[k].color)}</div></div>

        ${total ? '' : '<div class="muted" style="margin-top:10px;font-size:13.5px">Nothing recorded in this period yet.</div>'}</div>
    </div>${duesCard}`;
  wireChart();

/* ─── stacked bar chart (hand-drawn SVG — no libraries needed) ─── */
let chartPts = [];
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function chartSvg(series) {
  const pts = chartPts = series.points, n = pts.length;
  const W = 760, H = 250, L = 46, R = 6, T = 12, B = 28, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(...pts.map(p => p.total), 1)), step = iw / n, bw = Math.max(2, Math.min(step * 0.68, 46));
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const y = T + ih - (ih * i) / 4;
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 8}" y="${y + 4}" text-anchor="end">${i === 0 ? '0' : inrShort((max * i) / 4)}</text>`;
  }
  const every = Math.max(1, Math.ceil(n / 10));
  pts.forEach((p, i) => {
    const cx = L + step * i + step / 2;
    let y = T + ih;
    let bars = '';
    CAT_KEYS.forEach(k => { const v = p.by_category[k]; if (!v) return; const h = (v / max) * ih; y -= h; bars += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(h, 1)}" fill="${CATS[k].color}" rx="1.5"/>`; });
    g += `<g class="bar" data-i="${i}"><rect class="hit" x="${L + step * i}" y="${T}" width="${step}" height="${ih}" fill="transparent"/>${bars}</g>`;
    if (i % every === 0) {
      const lbl = series.granularity === 'day' ? (p.key.slice(8) === '01' || i === 0 ? fmtShort(p.key) : String(+p.key.slice(8))) : `${MON[+p.key.slice(5, 7) - 1]} ${p.key.slice(2, 4)}`;
      g += `<text class="axis" x="${cx}" y="${H - 8}" text-anchor="middle">${lbl}</text>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Collections chart">${g}</svg>`;
}
function wireChart() {
  const wrap = $('#chartWrap'); if (!wrap) return;
  const tip = $('#chartTip');
  const show = e => {
    const bar = e.target.closest('.bar'); if (!bar) { tip.classList.remove('show'); return; }
    const p = chartPts[+bar.dataset.i], gran = REV.summary.series.granularity;
    const title = gran === 'day' ? fmtDate(p.key) : `${MON[+p.key.slice(5, 7) - 1]} ${p.key.slice(0, 4)}`;
    tip.innerHTML = `<b>${title}</b>` + (p.total ? CAT_KEYS.filter(k => p.by_category[k]).map(k => `<div class="tr"><span><i style="background:${CATS[k].color}"></i>${CATS[k].short}</span><span>${inr(p.by_category[k])}</span></div>`).join('') + `<div class="tr" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><b style="margin:0">Total</b><b style="margin:0">${inr(p.total)}</b></div>` : '<div class="muted">No collections</div>');
    const wr = wrap.getBoundingClientRect(), br = bar.getBoundingClientRect();
    let left = br.left - wr.left + br.width / 2 - tip.offsetWidth / 2;
    left = Math.max(0, Math.min(left, wr.width - tip.offsetWidth));
    tip.style.left = left + 'px'; tip.style.top = Math.max(0, br.top - wr.top - tip.offsetHeight - 6) + 'px';
    tip.classList.add('show');
  };
  wrap.addEventListener('mousemove', show); wrap.addEventListener('click', show);
  wrap.addEventListener('mouseleave', () => tip.classList.remove('show'));
}

    <div class="card">
      <div class="card-head"><h3>Plan prices</h3></div>
      <p class="muted" style="margin-bottom:14px;font-size:14px">These pre-fill the price when you add or renew a member. Changing them never alters memberships already sold. You can still change the price for any single member (e.g. a discount).</p>
      ${block('male', 'Men')}${block('female', 'Women')}
      <div style="margin-top:16px"><button class="btn btn-primary" data-act="save-prices">${ic('check')}Save prices</button></div>
    </div>
    <div class="set-grid" style="margin-top:14px">
      <div class="card"><div class="card-head"><h3>Data &amp; backup</h3></div>
        <p class="muted" style="font-size:14px;margin-bottom:14px">Free hosting can erase the database when the app redeploys or sleeps for long. Download a backup regularly and keep it somewhere safe (Google Drive / email to yourself).</p>
        <div class="stack"><button class="btn btn-block" data-act="backup">${ic('db')}Download full backup (.db)</button>
        <button class="btn btn-block" data-act="export-members">${ic('download')}Export members (CSV)</button>
        <button class="btn btn-block btn-danger" data-act="restore-pick">${ic('undo')}Restore from a backup…</button>
        <input type="file" id="restoreFile" accept=".db,.sqlite,.sqlite3,application/octet-stream,application/x-sqlite3" hidden></div></div>
      <div class="card"><div class="card-head"><h3>Security</h3></div>
        <div class="kv"><span>Admin login</span><span class="ok-t">Password protected</span></div>
        <div class="kv"><span>Revenue PIN</span><span class="${S.pinRequired ? 'ok-t' : 'muted'}">${S.pinRequired ? 'On — revenue needs the PIN' : 'Off'}</span></div>
        ${S.pinRequired ? '' : `<p class="muted" style="font-size:13px;margin:10px 0 0">Want only you to see revenue while staff use the member screens? Add <b>REVENUE_PIN=1234</b> (your own number) to <b>.env</b> and restart.</p>`}
        <div class="stack" style="margin-top:14px">${S.pinRequired ? `<button class="btn btn-block" data-act="rev-lock-now">${ic('lock')}Lock revenue now</button>` : ''}<button class="btn btn-block btn-danger" id="setLogout">${ic('logout')}Log out</button></div></div>
    </div>
    <div class="card" style="margin-top:14px"><div class="card-head"><h3>System</h3></div>
      <div class="kv"><span>Today (server, IST)</span><span>${fmtDate(S.today)}</span></div>
      <div class="kv"><span>Members in database</span><span>${S.members.length}</span></div>
      <div class="kv"><span>WhatsApp automatic sending</span><span class="${S.meta ? 'ok-t' : 'warn-t'}">${S.meta ? 'Connected' : 'Not configured'}</span></div>
      <div class="kv"><span>Admin version</span><span>2.0</span></div></div>`;
  $$('[data-price]').forEach(i => i.addEventListener('input', e => digitsOnly(e.target)));
  $('#setLogout').addEventListener('click', logout);
  $('#restoreFile').addEventListener('change', onRestoreFile);
};

ACTIONS['save-prices'] = async el => {
  const body = { male: {}, female: {} };
  for (const i of $$('[data-price]')) {
    const [g, p] = i.dataset.price.split(':'), v = num(i.value);
    if (v <= 0) { i.classList.add('invalid'); i.focus(); return toast('Every price must be more than ₹0.', 'err'); }
    i.classList.remove('invalid'); body[g][p] = v;
  }
  el.disabled = true;
  try { S.prices = await apiSend('PUT', '/api/settings/plan-prices', body); toast('Prices saved.'); } catch (e) { toastErr(e); }
  el.disabled = false;
};
ACTIONS.backup = async el => {
  el.disabled = true;
  try {
    const res = await api('/api/backup', { raw: true });
    downloadBlob(await res.blob(), `xgym-backup-${S.today}.db`);
    toast('Backup downloaded — keep it safe.');
  } catch (e) { if (e.status !== 403) toastErr(e); }
  el.disabled = false;
};
ACTIONS['rev-lock-now'] = async () => { try { await api('/api/revenue/lock', { method: 'POST' }); S.unlocked = false; buildNav(); toast('Revenue locked.'); } catch (e) { toastErr(e); } };

ACTIONS['restore-pick'] = () => $('#restoreFile').click();
async function onRestoreFile(e) {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const send = dry => { const f = new FormData(); f.append('file', file); return api('/api/restore' + (dry ? '?dry_run=1' : ''), { method: 'POST', form: f }); };
  try {
    const { counts } = await send(true);                       // 1) just look inside the file
    const ok = await confirmBox({
      title: 'Restore <span>backup?</span>', danger: true, okText: 'Replace everything',
      message: `<b>${esc(file.name)}</b> contains <b>${counts.members}</b> member${counts.members === 1 ? '' : 's'}, <b>${counts.memberships}</b> membership period${counts.memberships === 1 ? '' : 's'} and <b>${counts.payments}</b> payment${counts.payments === 1 ? '' : 's'}.<br><br>
        This <b>replaces everything currently in the system</b> (${S.members.length} member${S.members.length === 1 ? '' : 's'} now). A safety copy of the current data is kept on the server as <i>pre-restore-backup.db</i>.`,
    });
    if (!ok) return;
    await send(false);                                         // 2) really restore
    await refreshData(); rerender();
    toast(`Restored ${counts.members} members and ${counts.payments} payments.`);
  } catch (err) { if (err.status !== 403) toastErr(err); }
}
/* ─── boot: is there already a valid session? ─── */
(async function boot() {
  try {
    const s = await api('/api/session', { noAuthRedirect: true });
    if (s.authenticated) { await startApp(); return; }
  } catch (e) { /* server down → show login, the error appears on submit */ }
  showLogin();
})();
</script>
</body>
</html>
